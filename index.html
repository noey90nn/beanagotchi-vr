"use strict";
// BeanagotchiRules.ts

//
// Shared rules for Beanagotchi, the coffee virtual pet.
// This script has no component. BeanagotchiGame and BeanagotchiUI read it.
// Change numbers here to tune the game.
// ---------- Network events ----------
// UI -> server: "I'm here, send me my save"
// server -> one player's UI: the save (JSON text, '' if none) and the server clock
// UI -> server: please store this save
// UI -> server: play a sound for me only
// keychain playdates: UI -> server: what my pet is (so friends see its name)
// server -> one player's UI: you're having a playdate with this friend
// tricks: UI -> server: I just did a trick (nearby players see it)
// server -> one player's UI: a nearby friend's pet did a trick
// 3D pet that follows you (all on your own device):
// the game -> the 3D pet: what to look like right now
// the game -> the 3D pet: do a move now (wave, spin, dance, flip, happy, pat, no, evolve)
// the 3D pet -> the game: I just appeared, send me the pet
// gifts: server -> one player's UI: friends close enough to get a gift (nearest first)
// UI -> server: send this gift to that player
// server -> the friend's UI: you got a gift
// server -> the sender's UI: did it arrive?
// server -> the keychain's owner: follow my hip smoothly (mobile/desktop), or stop following
// the keychain's owner -> server: "my hip-follow script is running"
const SAVE_VERSION = 1;
// ---------- Growing up (seconds of age) ----------
const EGG_SECONDS = 40; // cherry hatches
const BABY_END = 8 * 60; // Green Sprout -> Roasted Beanie
const CHILD_END = 30 * 60; // Roasted Beanie -> adult form

const EGG_TAP_SECONDS = 2; // each tap on the cherry warms it this much
const STAGE_EGG = 0;
const STAGE_BABY = 1;
const STAGE_CHILD = 2;
const STAGE_ADULT = 3;
const FORM_NONE = 0;
const FORM_CLOUD = 1; // great care
const FORM_MOCHA = 2; // okay care
const FORM_BURNT = 3; // poor care
const CARE_CLOUD = 70; // average care needed
const CARE_MOCHA = 40;
function stageName(stage, form, kind = 0) {
    if (stage === STAGE_EGG)
        return 'Coffee Cherry';
    const k = KINDS[kind] || KINDS[0];
    if (stage === STAGE_BABY)
        return k.stages[0];
    if (stage === STAGE_CHILD)
        return k.stages[1];
    if (form === FORM_CLOUD)
        return k.stages[2];
    if (form === FORM_MOCHA)
        return k.stages[3];
    return k.stages[4];
}

const DAY_OFFSET_HOURS = -5;

const DAILY_STEP = 5; // +5 more coins each day in a row (day 2 = 15 ... day 7 = 40)
const DAY7_BONUS = 50; // extra on every 7th day in a row
function dayIndex(ms) {
    return Math.floor((ms + DAY_OFFSET_HOURS * 3600 * 1000) / 86400000);
}
function dailyTip(streak) {
    const d = ((streak - 1) % 7) + 1; // 1..7, then starts over
    return DAILY_BASE + DAILY_STEP * (d - 1) + (d === 7 ? DAY7_BONUS : 0);
}

// Everyone in the world sees the same weather. It changes every WEATHER_HOURS hours.
const WEATHER_HOURS = 2;

function weatherAt(ms) {
    if (WEATHER_FORCE)
        return WEATHER_FORCE;
    const b = weatherBlock(ms);
    let x = Math.imul(b | 0, 0x9E3779B1); // simple hash of the time block, same for everyone
    x ^= x >>> 15;
    x = Math.imul(x, 0x85EBCA6B);
    x ^= x >>> 13;
    const r = ((x >>> 0) % 1000) / 1000;
    const local = new Date(ms + DAY_OFFSET_HOURS * 3600 * 1000);
    const month = local.getUTCMonth() + 1;
    const hour = local.getUTCHours();
    const winter = SNOW_MONTHS.indexOf(month) >= 0;
    if (r < 0.22)
        return winter && r < 0.12 ? 'snow' : 'rain';
    if (r < 0.34 && hour >= 7 && hour < 18)
        return 'rainbow';
    if (winter && r < 0.36)
        return 'snow';
    return 'clear';
}

function chatLine(topic) {
  const s = G.s;
  let lines = CHAT[topic] || [];

  if (topic === 'wx') lines = WEATHER_CHAT[G.weather] || [];
  if (topic === 'kind') lines = (typeof KIND_CHAT !== 'undefined' && KIND_CHAT[s.kind]) || [];
  if (!lines.length) return '';
  const outfit = OUTFITS.filter((o) => s.wear.indexOf(o.id) >= 0)[0];
  return chatFill(lines[Math.floor(Math.random() * lines.length)], { name: s.name, owner: 'friend', kind: (KINDS[s.kind] || KINDS[0]).name, outfit: outfit ? outfit.name : 'outfit', friend: 'friend' });
}
function pickChatTopic() {
  const s = G.s;
  if (s.asleep) return 'sleeptalk';
  if (s.sick) return 'sick';
  if (s.full < 30) return 'hungry';
  if (s.energy < 20) return 'sleepy';
  if (s.poops >= 2) return 'messy';
  if (s.happy < 30) return 'bored';
  if (s.stage === STAGE_BABY && Math.random() < 0.5) return 'baby';
  const pool = ['happy', 'fact', 'kind', 'kind'];
  const h = new Date().getHours();
  pool.push(h >= 5 && h < 11 ? 'morning' : h < 17 ? 'afternoon' : h < 21 ? 'evening' : 'night');
  if (s.wear.length) pool.push('outfit');
  if (s.trait) pool.push('trait', 'trait');

  return pool[Math.floor(Math.random() * pool.length)];
}

}

// ---- load, daily tip jar
function load() {
  const parsed = parseSave(lsGet(LS_KEY) || '');
  const s = parsed || newSave();
  G.s = s;
  const t = Date.now(); const notes = [];
  if (!parsed) notes.push('A coffee cherry! Point at it and press the trigger to keep it warm.');
  else if (s.lastSeen > 0) {
    const away = (t - s.lastSeen) / 1000;
    const counted = s.trip ? Math.max(0, (t - Math.max(s.lastSeen, s.tripUntil)) / 1000) : away;
    const ev = applyOffline(s, counted);
    if (away > 120 && !s.gone && !s.retired) notes.push(s.name + ' missed you! Away ' + formatAge(away) + '.');
    if (ev.indexOf('evolve') >= 0) notes.push('It grew into a ' + stageName(s.stage, s.form, s.kind) + '!');
    else if (ev.indexOf('hatch') >= 0) notes.push('It hatched while you were away!');
  }
  const today = dayIndex(t);
  if (today !== s.lastDay) {
    s.streak = (s.lastDay > 0 && today - s.lastDay === 1) ? s.streak + 1 : 1;
    s.lastDay = today;
    const tip = dailyTip(s.streak) + cafeTip(s.cafe);
    s.coins += tip;
    if (!s.gone && !s.retired) {
      const d = ((s.streak - 1) % 7) + 1;
      G.pendingBanner = [s.streak === 1 ? 'Welcome! Day 1' : s.streak + ' days in a row!', 'Tip jar: +' + tip + ' coins' + (cafeTip(s.cafe) ? ' (' + CAFE_LEVELS[s.cafe].name + ' +' + cafeTip(s.cafe) + ')' : '') + (d === 7 ? '  ·  7th-day bonus!' : '  ·  come back tomorrow for more')];
    }
    notes.push('Daily tip jar: +' + tip + ' coins (streak ' + s.streak + ').');
  }
  noteAlbum(s);
  say(notes.length ? notes.join(' ') : 'Welcome back! ' + s.name + ' is happy to see you.');
  G.nextWish = now() + 90000;
  G.nextChat = now() + 8000;
  saveNow();
}

  const known = tricksKnown(s.playXp);

    const t = known[known.length - 1];
    setTimeout(() => { if (!ready()) return; anim('evolve', 1600); sfx('Evolve'); busy(1700); say(s.name + ' learned a new trick: ' + t.name + '! Open Tricks on the board to show it off.'); }, 2200);

  if (g.pouring) { pr.level = (t - pr.start) / 1000 / pourTime(); if (pr.level >= 1.2) stopPour(true); }
  const f = Math.min(1, pr.level);
  coffeeNode.m = M4.chain(M4.T(TX, TY + 0.012, TZ), M4.S(1, Math.max(0.0005, f * (GLASS_H - 0.012)), 1));
  coffeeNode.visible = f > 0.002;
  const y0 = TY + 0.012 + (pr.c - ZONE / 2) * (GLASS_H - 0.012);
  zoneNode.m = M4.T(TX, y0, TZ); zoneFill.m = M4.T(TX, y0, TZ);
  streamNode.visible = !!g.pouring;
  const top = PITCHER_Y + 0.02, bot = TY + 0.012 + f * (GLASS_H - 0.012);
  streamNode.m = M4.chain(M4.T(TX, bot, TZ), M4.S(1, Math.max(0.01, top - bot), 1));
  spillNode.visible = pr.spill;
}
function stopPour(overflow) {
  const g = G.game;
  if (!g || g.type !== 'pour' || !g.pouring) return;
  g.pouring = false;
  const level = overflow ? 1.2 : Math.min(1.2, (now() - pr.start) / 1000 / pourTime());
  pr.level = level;
  const f = Math.min(1, level);
  let msg;
  if (overflow || level > 1) { msg = 'Overflow! Coffee everywhere!'; pr.spill = true; sfx('No'); }
  else if (Math.abs(f - pr.c) <= PERFECT) { g.wins++; g.perfects = (g.perfects || 0) + 1; msg = 'PERFECT POUR!'; sfx('Coin'); }
  else if (Math.abs(f - pr.c) <= ZONE / 2) { g.wins++; msg = 'Good pour!'; sfx('Happy'); }
  else if (f < pr.c) { msg = 'Too little!'; sfx('No'); }
  else { msg = 'Too much!'; sfx('No'); }
  gameRes(msg);
  later(() => {
    if (g.round < POUR_ROUNDS) nextPour();
    else { const p = g.perfects || 0; const c = finishGame(g.wins, p * POUR_PERFECT_COINS); gameRes((g.wins >= GAME_WIN_AT ? 'Master pourer! ' : 'Nice try! ') + g.wins + '/' + POUR_ROUNDS + ' good' + (p ? ', ' + p + ' perfect' : '') + '. +' + c + ' coins'); }
  }, 1700);
  dirty();
}

const wk = { beans: [] };
for (let i = 0; i < WHACK_HOLES; i++) {
  const x = TX + (i % 2 ? 0.17 : -0.17), z = TZ + (Math.floor(i / 2) - 1) * 0.42;
  E.add(node(holeMesh, M4.T(x, TY, z), gameRoots.whack));
  const n = E.add(node(goodMesh, M4.T(x, TY - 0.15, z), gameRoots.whack));
  wk.beans.push({ n, x, z, kind: 0, upAt: 0, hideT: 0, hitAt: 0, hitKind: 0 });
}
function whackHud() { const g = G.game; g.info = 'Beans: ' + g.good + '/' + WHACK_NEED; dirty(); }
function nextWhack() {
  const g = G.game;
  g.round++; g.good = 0; g.live = false;
  const r = g.round - 1;
  const showMs = (WHACK_SHOW[r] || WHACK_SHOW[WHACK_SHOW.length - 1]) * 1000;
  const seq = [];
  for (let k = 0; k < WHACK_GOOD; k++) seq.push(1);
  for (let k = 0; k < (WHACK_BURNT[r] || 0); k++) seq.push(2);
  for (let k = seq.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); const t = seq[k]; seq[k] = seq[j]; seq[j] = t; }
  if (seq[0] === 2) { const j = seq.indexOf(1); seq[j] = 2; seq[0] = 1; }
  whackHud();
  gameRes(g.round === 1 ? 'Whack the beans! Not the burnt ones!' : 'Round ' + g.round + ': faster!');
  const gap = g.round >= 4 ? showMs * 0.55 + 150 : showMs * 0.75 + 220;
  let t = 1300;
  later(() => { g.live = true; }, 1100);
  for (const kind of seq) { later(() => popBean(kind, showMs), t); t += gap; }
  later(() => endWhackRound(), t + showMs + 250);
}
function popBean(kind, showMs) {
  const free = [];
  wk.beans.forEach((b, i) => { if (!b.kind) free.push(i); });
  if (!free.length) return;
  const b = wk.beans[free[Math.floor(Math.random() * free.length)]];
  b.kind = kind; b.n.mesh = kind === 1 ? goodMesh : burntMesh; b.upAt = now(); b.hideT = now() + showMs;
  if (kind === 1) sfx('Tap');
}
function whackAt(i, source) {
  const g = G.game;
  if (!g || g.type !== 'whack' || !g.live) return;
  const b = wk.beans[i]; if (!b || !b.kind) return;
  const kind = b.kind; b.kind = 0; b.hitAt = now(); b.hitKind = kind;
  if (kind === 1) { g.good++; sfx('Cup'); pulse(source, 0.7, 50); }
  else { g.good = Math.max(0, g.good - 1); sfx('No'); pulse(source, 1, 160); }
  whackHud();
}
function endWhackRound() {
  const g = G.game;
  g.live = false;
  for (const b of wk.beans) b.kind = 0;
  const won = g.good >= WHACK_NEED;
  if (won) g.wins++;
  gameRes(won ? 'Round won! ' + g.good + ' beans whacked.' : 'Only ' + g.good + ' beans. You need ' + WHACK_NEED + '.');
  sfx(won ? 'Happy' : 'No');
  later(() => {
    if (g.round < WHACK_ROUNDS) nextWhack();
    else { const c = finishGame(g.wins, 0); gameRes((g.wins >= GAME_WIN_AT ? 'Bean master! ' : 'Nice try! ') + g.wins + '/' + WHACK_ROUNDS + ' rounds. +' + c + ' coins'); }
  }, 1800);
}

function updateGames(t) {
  const g = G.game; if (!g) return;
  if (g.type === 'hide') {
    hs.cups.forEach((c, i) => { const p = cupPos(i, t); c.m = M4.T(p[0], p[1], p[2]); });
    const p = cupPos(hs.answer, t);
    hs.bean.mesh = petNode.mesh;
    hs.bean.m = M4.chain(M4.T(p[0], TY, p[2]), M4.RY(-Math.PI / 2), M4.S(G.s.stage === STAGE_ADULT ? 0.42 : 0.55));
  } else if (g.type === 'pour') updatePour(t);
  else if (g.type === 'whack') {
    for (const b of wk.beans) {
      let y = -0.15;
      if (b.kind) {
        if (t >= b.hideT) b.kind = 0;
        else y = -0.15 + 0.15 * Math.min(1, (t - b.upAt) / 120);
      }
      let sq = 1;
      if (!b.kind && b.hitAt && t - b.hitAt < 220) { const q = (t - b.hitAt) / 220; y = -0.15 * q; sq = 1 - 0.5 * Math.sin(q * Math.PI); b.n.mesh = b.hitKind === 1 ? goodMesh : burntMesh; }
      else if (!b.kind && b.upAt && t - b.hideT < 120 && t >= b.hideT) y = -0.15 * Math.min(1, (t - b.hideT) / 120);
      b.n.m = M4.chain(M4.T(b.x, TY + y, b.z), M4.RY(-Math.PI / 2), M4.S(1, sq, 1));
    }
  }
}

function pick(o, d) {
  let best = null;
  for (const P of panels) {
    if (!E.shown(P.n)) continue;
    const hb = rayQuad(o, d, E.world(P.n), P.n.w, P.n.h);
    if (!hb || (best && hb.t > best.t)) continue;
    const px = hb.u * P.pxW, py = hb.v * P.pxH;
    const b = P.btns.filter((q) => px >= q.X && px <= q.X + q.W && py >= q.Y && py <= q.Y + q.H)[0];
    best = { t: hb.t, kind: 'panel', P, id: b ? b.id : null, label: null };
  }
  const tryHit = (center, r, info) => {
    const t = raySphere(o, d, center, r);
    if (t > 0 && (!best || t < best.t)) best = Object.assign({ t }, info);
  };
  if (petNode.visible) {
    const pw = M4.pt(E.world(petNode), 0, 0.1, 0);

  }
  for (const p of props) {

    tryHit(p.center, p.r, { kind: p.kind, id: p.id, label: p.label, prop: p });
  }
  for (const q of gameTargets()) tryHit(q.center, q.r, q);
  return best;
}

    const vp = layer.getViewport(view);
    gl.viewport(vp.x, vp.y, vp.width, vp.height);
    E.draw(M4.mul(view.projectionMatrix, view.transform.inverse.matrix), head);
  }
}
